# STAC CATALOG SPECIFICATIONS

version: v3.0.4

catalog_properties:
  name: stac
  url_template: "https://stac-extensions.github.io/{extension_name}/{extension_version}/schema.json"
  extensions:
    - name: file
      version: v2.1.0
    - name: alternate-assets
      version: v1.2.0
  regex_id: '^CMIP6(\.[A-Za-z0-9-]+){8}\.v[0-9]{8}$'
  regex_base_id: '^CMIP6(\.[A-Za-z0-9-]+){8}$'

dataset_properties:
  - source_collection: activity_id
    catalog_field_value_type: string_array
    is_required: true

  - source_collection: Conventions
    catalog_field_value_type: string_array
    is_required: false

  - source_collection: data_specs_version
    catalog_field_value_type: string
    is_required: true

  - source_collection: null
    catalog_field_name: experiment
    catalog_field_value_type: string
    is_required: false

  - source_collection: experiment_id
    catalog_field_value_type: string
    is_required: true

  - source_collection: forcing_index
    catalog_field_value_type: string
    is_required: false

  - source_collection: frequency
    catalog_field_value_type: string
    is_required: true

  - source_collection: null
    catalog_field_name: grid
    catalog_field_value_type: string
    is_required: false

  - source_collection: grid_label
    catalog_field_value_type: string
    is_required: true

  - source_collection: initialization_index
    catalog_field_value_type: string
    is_required: false

  - source_collection: institution_id
    source_collection_key: description
    catalog_field_name: institution
    catalog_field_value_type: string
    is_required: false

  - source_collection: institution_id
    catalog_field_value_type: string
    is_required: true

  - source_collection: license
    catalog_field_value_type: string
    is_required: false

  - source_collection: mip_era
    catalog_field_value_type: string
    is_required: true

  - source_collection: member_id
    catalog_field_value_type: string
    is_required: true

  - source_collection: nominal_resolution
    catalog_field_value_type: string
    is_required: true

  - source_collection: physics_index
    catalog_field_value_type: string
    is_required: false

  - source_collection: tracking_id
    catalog_field_name: pid
    catalog_field_value_type: string
    is_required: true

  - source_collection: product
    catalog_field_value_type: string
    is_required: true

  - source_collection: realization_index
    catalog_field_value_type: string
    is_required: false

  - source_collection: realm
    catalog_field_value_type: string_array
    is_required: true

  - source_collection: null
    catalog_field_name: source
    catalog_field_value_type: string
    is_required: false

  - source_collection: source_id
    catalog_field_value_type: string
    is_required: true

  - source_collection: source_type
    catalog_field_value_type: string_array
    is_required: true

  - source_collection: sub_experiment_id
    source_collection_key: description
    catalog_field_name: sub_experiment
    catalog_field_value_type: string
    is_required: false

  - source_collection: sub_experiment_id
    catalog_field_value_type: string
    is_required: true

  - source_collection: table_id
    catalog_field_value_type: string
    is_required: true

  - source_collection: variable_id
    source_collection_key: standard_name
    catalog_field_name: variable_cf_standard_name
    catalog_field_value_type: string
    is_required: true

  - source_collection: variable_id
    catalog_field_value_type: string
    is_required: true

  - source_collection: null
    catalog_field_name: variable_long_name
    catalog_field_value_type: string
    is_required: true

  - source_collection: variable_id
    source_collection_key: units
    catalog_field_name: variable_units
    catalog_field_value_type: string
    is_required: true

  - source_collection: variant_label
    catalog_field_value_type: string
    is_required: true

file_properties:
  - source_collection: tracking_id
    catalog_field_value_type: string
    is_required: false

link_properties:
  - rel: cite-as
    link_pattern: "^https?://cera-www\\.dkrz\\.de/WDCC/meta/CMIP6/.*$"
    link_type: "application/json"
    title: "Citation URL"
    is_required: true

  - rel: describedby
    link_pattern: "^https?://furtherinfo.es-doc.org/CMIP6.*$"
    link_type: "text/html"
    title: "ES-DOC"
    is_required: false

  - rel: related
    link_pattern: "^https?://errata.esgf.io/.*$"
    link_type: "text/html"
    title: "Errata issue"
    is_required: false

